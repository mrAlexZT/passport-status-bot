services:
  mfa_passport_bot:
    depends_on:
      - mongodb
    build: .
    restart: unless-stopped
    volumes:
      - .:/mfa_passport_bot
    environment:
      - TZ=Europe/London
    networks:
      - mfa_passport_bot_net

  mongodb:
    image: mongo:4.4
    volumes:
      - dbdata1:/data/db
    restart: unless-stopped
    networks:
      - mfa_passport_bot_net

volumes:
  dbdata1:

networks:
  mfa_passport_bot_net:
    driver: bridge
